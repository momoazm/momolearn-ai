<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in Â· MBZUAI Interview Coach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b0d12; --panel: #12151c; --panel2: #171b25; --border: #232838;
      --text: #e8eaf0; --muted: #8a91a5; --accent: #7c6cff; --ok: #34d399; --bad: #f87171;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: grid; place-items: center; padding: 20px;
    }
    .wrap { width: min(400px, 100%); }
    .logo { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 22px; }
    .logo .mark {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(124,108,255,.35), rgba(52,211,153,.2));
      border: 1px solid rgba(124,108,255,.5); display: grid; place-items: center; color: #cdc9ff;
    }
    .logo h1 { font-size: 16px; font-weight: 600; }
    .logo p { font-size: 12px; color: var(--muted); }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab {
      flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; font-family: inherit;
    }
    .tab.on { color: var(--text); border-color: var(--accent); background: rgba(124,108,255,.1); }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
    input {
      width: 100%; background: var(--panel2); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 11px 13px; font-size: 14px; outline: none; font-family: inherit;
    }
    input:focus { border-color: var(--accent); }
    button.go {
      width: 100%; margin-top: 18px; background: var(--accent); border: none; color: white;
      font-weight: 600; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-family: inherit;
    }
    button.go:disabled { opacity: .5; cursor: default; }
    .err { color: var(--bad); font-size: 12.5px; margin-top: 10px; min-height: 16px; line-height: 1.4; }
    .note { margin-top: 16px; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.5; }
    .denied { display: none; text-align: center; }
    .denied h2 { font-size: 15px; margin-bottom: 8px; }
    .denied p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
    .denied button { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-family: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <div class="mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
      </div>
      <div>
        <h1>MBZUAI Interview Coach</h1>
        <p>AI admissions interview practice</p>
      </div>
    </div>

    <div class="card" id="authCard">
      <div class="tabs">
        <button class="tab on" id="tabLogin" type="button">Sign in</button>
        <button class="tab" id="tabRegister" type="button">Create account</button>
      </div>
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" placeholder="username" />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" />
      <button class="go" id="goBtn">Sign in</button>
      <div class="err" id="err"></div>
      <div class="note">Independent practice simulator inspired by publicly available information about AI graduate admissions. Not affiliated with MBZUAI. Free sign-in Â· your progress is saved to your account.</div>
    </div>
    <p style="text-align:center; margin-top:14px; font-size:12.5px;">
      <a href="/keys.html" style="color:var(--muted);">Practice unlimited — add a free AI key</a>
    </p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let mode = 'login';

    const setMode = (m) => {
      mode = m;
      $('tabLogin').classList.toggle('on', m === 'login');
      $('tabRegister').classList.toggle('on', m === 'register');
      $('goBtn').textContent = m === 'login' ? 'Sign in' : 'Create account';
      $('err').textContent = '';
    };
    $('tabLogin').addEventListener('click', () => setMode('login'));
    $('tabRegister').addEventListener('click', () => setMode('register'));

    async function submit() {
      const btn = $('goBtn');
      btn.disabled = true;
      $('err').textContent = '';
      try {
        const res = await fetch('/api/auth/' + mode, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: $('username').value.trim(), password: $('password').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) {
          $('err').textContent = data.error || 'Something went wrong.';
          return;
        }
        localStorage.setItem('mi.token', data.token);
        localStorage.setItem('mi.username', data.username);
        location.href = '/interview.html';
      } catch {
        $('err').textContent = 'Network error.';
      } finally {
        btn.disabled = false;
      }
    }
    $('goBtn').addEventListener('click', submit);
    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });

    (async function boot() {
      const token = localStorage.getItem('mi.token');
      if (!token) return;
      try {
        const res = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
        if (!res.ok) { localStorage.removeItem('mi.token'); return; }
        location.href = '/interview.html';
      } catch {}
    })();
  </script>
</body>
</html>
