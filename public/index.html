<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MomoLearn AI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <link rel="stylesheet" href="/mbzuai/mbzuai.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0b0d12;
      --panel: #12151c;
      --border: #232838;
      --text: #e8eaf0;
      --muted: #8a91a5;
      --accent: #7c6cff;
      --ok: #34d399;
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
    }
    .app { width: min(760px, 100%); display: flex; flex-direction: column; height: 100%; }
    header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 17px; font-weight: 600; }
    header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
    header small { color: var(--muted); margin-left: auto; font-size: 12px; }
    .bell {
      width: 34px; height: 34px; padding: 0;
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); display: grid; place-items: center;
      border-radius: 10px; cursor: pointer; flex-shrink: 0;
    }
    .bell.on { color: var(--accent); border-color: var(--accent); }
    .notify-host {
      position: fixed; right: 16px; bottom: 16px; z-index: 1000;
      display: flex; flex-direction: column; gap: 10px;
      width: min(340px, calc(100vw - 32px));
    }
    .notify {
      position: relative; cursor: pointer;
      background: var(--panel); border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 12px; padding: 12px 32px 12px 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
      opacity: 0; transform: translateY(12px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .notify.show { opacity: 1; transform: translateY(0); }
    .notify.warn { border-left-color: #f59e0b; }
    .notify strong { display: block; font-size: 13.5px; margin-bottom: 4px; }
    .notify p {
      font-size: 12.5px; color: var(--muted); line-height: 1.45;
      max-height: 58px; overflow: hidden;
    }
    .notify-close {
      position: absolute; top: 4px; right: 6px;
      background: none; border: none; padding: 2px 6px;
      color: var(--muted); font-size: 15px; line-height: 1; cursor: pointer;
    }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 82%; padding: 11px 14px; border-radius: 14px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
    .msg.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .badge { display: inline-block; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .badge .tier-free { color: var(--ok); }
    form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
    input {
      flex: 1; background: var(--panel); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 13px 15px; font-size: 14.5px; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent); border: none; color: white; font-weight: 600;
      padding: 0 22px; border-radius: 10px; cursor: pointer; font-size: 14.5px;
    }
    button:disabled { opacity: .5; cursor: default; }
    .status { font-size: 12px; color: var(--muted); padding: 0 20px 10px; min-height: 16px; }
    @media (max-width: 480px) { .msg { max-width: 94%; } }
  </style>
</head>
<body>
  <nav class="tabs floating-tabs" aria-label="Sections">
    <button class="tab" data-view="chat" type="button">Chat</button>
    <button class="tab" data-view="igcse" type="button">IGCSE</button>
    <button class="tab" data-view="mbzuai" type="button">MBZUAI Prep</button>
  </nav>
  <div class="app">
    <header>
      <span class="dot"></span>
      <h1>MomoLearn AI</h1>
      <small id="chainInfo">loading models…</small>
      <nav class="tabs" aria-label="Sections">
        <button class="tab active" data-view="chat" type="button">Chat</button>
        <button class="tab" data-view="mbzuai" type="button">MBZUAI Prep</button>
      </nav>
      <a href="https://mbzuai-interview.vercel.app" target="_blank" rel="noopener" class="bell" title="MBZUAI Interview Coach (opens your account login)" style="text-decoration:none; font-size:12px; font-weight:600;">Interview</a>
      <a href="/keys.html" id="keyChip" class="bell" title="Add your free AI key" aria-label="Add your free AI key" style="text-decoration:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      </a>
      <button class="bell" id="bell" type="button" title="Toggle pop-up notifications" aria-label="Toggle notifications">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </header>
    <div id="chat"></div>
    <div class="status" id="status"></div>
    <form id="form">
      <input id="input" placeholder="Ask anything…" autocomplete="off" />
      <button id="send">Send</button>
    </form>
  </div>

  <section id="mbzuaiView" hidden></section>

  <script src="/notify.js"></script>
  <script src="/byok.js"></script>
  <script>
    window.switchTab = function (view) {
      document.querySelector(`.tabs .tab[data-view="${view}"]`)?.click();
    };
    document.querySelectorAll('.tabs .tab').forEach((b) =>
      b.addEventListener('click', () => {
        document.querySelectorAll('.tabs .tab').forEach((x) => x.classList.toggle('active', x === b));
        const v = b.dataset.view;
        document.body.classList.toggle('non-chat', v !== 'chat');
        document.querySelector('.app').classList.toggle('hidden-app', v !== 'chat');
        window.dispatchEvent(new CustomEvent('momo-view', { detail: { view: v } }));
      }));
  </script>
  <script type="module" src="/mbzuai/app.js"></script>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const statusEl = document.getElementById('status');
    const bell = document.getElementById('bell');
    const history = [];

    function paintBell() {
      bell.classList.toggle('on', Notify.enabled);
      bell.title = Notify.enabled ? 'Notifications on — click to mute' : 'Notifications off — click to enable';
    }
    paintBell();
    function paintKeyChip() {
      var chip = document.getElementById('keyChip');
      var on = Boolean(window.Byok && Byok.get());
      chip.classList.toggle('on', on);
      chip.title = on ? 'Using your own AI key (' + Byok.get().provider + ')' : 'Add your free AI key';
    }
    paintKeyChip();
    bell.addEventListener('click', async () => {
      await Notify.setEnabled(!Notify.enabled);
      if (Notify.enabled) Notify.push({ title: 'Notifications on', body: 'You will be pinged when a chat stops or needs your answer.' });
      paintBell();
    });

    fetch('/api/models')
      .then((r) => r.json())
      .then((data) => {
        const cats = data.categories || [];
        const total = cats.reduce((n, c) => n + c.models.length, 0);
        document.getElementById('chainInfo').textContent =
          `smart routing · ${cats.length} categories · ${total} models`;
      })
      .catch(() => {});

    function bubble(role, text, meta) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (text) div.textContent = text;
      if (meta) {
        const b = document.createElement('span');
        b.className = 'badge';
        b.innerHTML = meta;
        div.appendChild(b);
      }
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;

      input.value = '';
      bubble('user', text);
      history.push({ role: 'user', content: text });
      send.disabled = true;

      const pending = bubble('bot', '', null);
      statusEl.textContent = 'routing…';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...(window.Byok ? Byok.headers() : {}) },
          body: JSON.stringify({ messages: [{ role: 'system', content: 'You are MomoLearn AI, a friendly study assistant.' }, ...history] }),
        });
        const data = await res.json();

        if (!res.ok) {
          const tried = (data.attempts || []).map((a) => a.model).join(', ');
          pending.textContent = data.error || 'Something went wrong.';
          if (tried) statusEl.textContent = `tried: ${tried}`;
          if ((res.status === 400 || res.status === 401) && /key/i.test(data.error || '')) {
            const fix = document.createElement('a');
            fix.href = data.fix || '/keys.html';
            fix.textContent = 'Add your free AI key \u2192 keys.html';
            fix.style.cssText = 'display:block;margin-top:6px;color:#cdc9ff;font-size:12px;';
            pending.appendChild(fix);
          }
          Notify.push({
            kind: 'warn',
            title: 'Chat stopped — needs your answer',
            body: `${data.error || 'Something went wrong.'} Click to retry.`,
          });
        } else {
          pending.textContent = data.content;
          const tierClass = data.tier === 'free' ? 'tier-free' : '';
          const badge = document.createElement('span');
          badge.innerHTML = `answered by <span class="${tierClass}">${data.model}</span> · ${data.category} route`;
          pending.appendChild(badge);
          history.push({ role: 'assistant', content: data.content });
          statusEl.textContent = '';
          Notify.push({
            title: 'Chat stopped · answer ready',
            body: `${data.model}: ${data.content.slice(0, 120)}${data.content.length > 120 ? '…' : ''}`,
          });
        }
      } catch {
        pending.textContent = 'Network error — is the server running?';
        Notify.push({
          kind: 'warn',
          title: 'Chat stopped — connection lost',
          body: 'Network error. Check that the server is running and try again.',
        });
      } finally {
        send.disabled = false;
        input.focus();
        chat.scrollTop = chat.scrollHeight;
      }
    });
  </script>
</body>
</html>
